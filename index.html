
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creyds Music Player</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:#f5f5f5}
.player{width:100%;max-width:340px;margin:0 auto;padding:16px;background:#111;border:1px solid #292929;border-radius:16px}
.top{display:flex;align-items:center;gap:12px}
.note{width:54px;height:54px;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(145deg,#252525,#171717);border-radius:12px;color:#6e1010;font-size:25px}
.info{min-width:0;flex:1}
.label{font-size:9px;letter-spacing:2px;color:#888;margin-bottom:5px}
.name{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:9px;color:#999;margin-top:5px}
.controls{display:flex;align-items:center;justify-content:center;gap:24px;margin:13px 0 9px}
button{border:0;cursor:pointer;color:#bbb;background:transparent;font-size:18px;padding:2px}
button:hover{color:#fff}
button.play{background:#fff;color:#111;width:39px;height:39px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.progress{display:flex;align-items:center;gap:8px;color:#888;font-size:9px}
input[type=range]{flex:1;min-width:0;height:4px;accent-color:#6e1010;cursor:pointer}
</style>
</head>

<body>

<div class="player">
  <div class="top">
    <div class="note">♫</div>
    <div class="info">
      <div class="label">NOW PLAYING</div>
      <div class="name" id="songName">Drown</div>
      <div class="sub" id="songCount">Bring Me The Horizon · 01 / 04</div>
    </div>
  </div>

  <div class="controls">
    <button id="prev" aria-label="Anterior">⏮</button>
    <button class="play" id="toggle" aria-label="Reproducir">▶</button>
    <button id="next" aria-label="Siguiente">⏭</button>
  </div>

  <div class="progress">
    <span id="elapsed">0:00</span>
    <input id="seek" type="range" min="0" max="100" value="0">
    <span id="duration">0:00</span>
  </div>

  <audio id="audio" preload="auto" autoplay></audio>
</div>

<script>
const songs = [
  {
    title: "Drown",
    url: "https://raw.githubusercontent.com/TheCreyds/BMTH/main/Drown.mp3"
  },
  {
    title: "Mantra",
    url: "https://raw.githubusercontent.com/TheCreyds/BMTH/main/Mantra.mp3"
  },
  {
    title: "Shadow Moses",
    url: "https://raw.githubusercontent.com/TheCreyds/BMTH/main/Shadow%20Moses.mp3"
  },
  {
    title: "Sleepwalking",
    url: "https://raw.githubusercontent.com/TheCreyds/BMTH/main/Sleepwalking.mp3"
  }
];

const audio = document.getElementById("audio");
const songName = document.getElementById("songName");
const songCount = document.getElementById("songCount");
const toggle = document.getElementById("toggle");
const seek = document.getElementById("seek");
const elapsed = document.getElementById("elapsed");
const duration = document.getElementById("duration");

let current = 0;

function time(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function updateInfo() {
  songName.textContent = songs[current].title;
  songCount.textContent =
    `Bring Me The Horizon · ${String(current + 1).padStart(2, "0")} / ${String(songs.length).padStart(2, "0")}`;
}

function playSong() {
  audio.play().then(() => {
    toggle.textContent = "Ⅱ";
  }).catch(() => {
    toggle.textContent = "▶";
  });
}

function loadSong(index, autoplay = false) {
  current = (index + songs.length) % songs.length;

  audio.pause();
  audio.src = songs[current].url;
  audio.load();

  updateInfo();

  toggle.textContent = "▶";
  seek.value = 0;
  elapsed.textContent = "0:00";
  duration.textContent = "0:00";

  if (autoplay) playSong();
}

toggle.addEventListener("click", function() {
  if (audio.paused) {
    playSong();
  } else {
    audio.pause();
    toggle.textContent = "▶";
  }
});

document.getElementById("prev").addEventListener("click", function() {
  loadSong(current - 1, true);
});

document.getElementById("next").addEventListener("click", function() {
  loadSong(current + 1, true);
});

audio.addEventListener("ended", function() {
  loadSong(current + 1, true);
});

audio.addEventListener("loadedmetadata", function() {
  duration.textContent = time(audio.duration);
});

audio.addEventListener("timeupdate", function() {
  elapsed.textContent = time(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    seek.value = (audio.currentTime / audio.duration) * 100;
  }
});

audio.addEventListener("play", function() {
  toggle.textContent = "Ⅱ";
});

audio.addEventListener("pause", function() {
  toggle.textContent = "▶";
});

seek.addEventListener("input", function() {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(seek.value) / 100) * audio.duration;
  }
});

/* AUTOPLAY CON SONIDO */

loadSong(0, true);

</script>
</body>
</html>
